# ローカルでNext.js(web)・Go API(api)・MySQL(db)の3つをまとめて起動する。
#   準備: cp .env.example .env をして、.env にパスワードなどを入れる
#   起動: docker compose up -d
#   停止: docker compose down      (DBのデータは残る)
#   停止してDBのデータも消す: docker compose down -v
#
# パスワードなどは .env に書き、このファイルには書かない。.env は2通りの方法で使う。
#   1. env_file: .env の変数をすべて、そのままコンテナに渡す(dbサービス)
#   2. ${変数名}: Composeが .env を自動で読み、このファイルの中の ${...} を値に置き換える(apiサービス)

services:
  db:
    image: mysql:8.4
    # MYSQL_ROOT_PASSWORD・MYSQL_DATABASE・MYSQL_USER・MYSQL_PASSWORD を渡す。
    # JWT_SECRET も渡るが、MySQLは使わない
    env_file:
      - .env
    volumes:
      # DBのデータを名前付きボリュームに保存し、コンテナを作り直しても消えないようにする
      - db-data:/var/lib/mysql
      # 初回起動時(ボリュームが空のとき)だけ、MySQLの公式イメージがこのフォルダのSQLを実行してテーブルを作る
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # 初期化中の一時サーバーはネットワークを受け付けないため、127.0.0.1宛てで応答すれば本番の起動が終わっている
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build: .
    # APIには env_file を使わず、必要な値だけを渡す。rootのパスワードをAPIに渡さないため
    environment:
      # ホスト名の db はComposeが作るネットワーク内で、上のdbサービスのコンテナを指す
      MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?parseTime=true&charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        # APIは起動時にDBへ接続できないと終了するため、dbのヘルスチェックが通ってから起動する
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    # frontend/Dockerfile からイメージを作る(.dockerignore も frontend/ のものが使われる)
    build: ./frontend
    # Macの3000番は npm run dev(開発サーバー)で使うことがあるため、コンテナは3001番に出す。
    # Go APIは http://localhost:3001 からのアクセスも許可している(internal/config/config.go)
    ports:
      - "3001:3000"
    # 画面のJavaScriptはブラウザで動き、ブラウザから直接 localhost:8080 のapiへリクエストを送る。
    # webコンテナからapiへは通信しないが、APIが使える状態になってから画面を出すため、apiのヘルスチェックを待つ
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  db-data:
